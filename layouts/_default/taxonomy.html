{{ define "main" }}
<div class="section">
  <div class="container">
    <h1 class="section-title">{{ .Title }}</h1>
    {{ with .Content }}<div class="term-intro">{{ . }}</div>{{ end }}
    {{ if eq .Kind "term" }}<p class="guide-count">{{ len .Pages }} guides</p>{{ end }}
    <div class="card-grid">
      {{ range .Pages }}
      <div class="card">
        <h2 class="card__title">{{ .Title }}</h2>
        <p class="card__desc">{{ .Params.description | default .Summary }}</p>
        <a href="{{ .Permalink }}" class="card__link">Read Guide ›</a>
      </div>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
