name: Competitive Research (Manual)

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Exact query to research with Claude web search'
        required: true
        type: string
      max_cost_usd:
        description: 'Manual cost cap acknowledgement'
        required: false
        default: '1.00'
        type: string
      confirm_paid_research:
        description: 'Type RUN_PAID_RESEARCH to confirm this uses paid Claude web search'
        required: true
        type: string

permissions:
  contents: write

env:
  TZ: America/Denver

jobs:
  competitive-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic python-dotenv requests

      - name: Run explicit competitive research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_PAID_COMPETITIVE_RESEARCH: ${{ github.event.inputs.confirm_paid_research == 'RUN_PAID_RESEARCH' && 'true' || 'false' }}
        run: python scripts/competitive_research.py --query "${{ github.event.inputs.query }}" --max-cost-usd "${{ github.event.inputs.max_cost_usd }}"

      - name: Rebuild SEO dashboard data
        run: python scripts/build_seo_data.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git add reports/ scripts/syndication_log.txt static/data/seo.json || true
          git diff --staged --quiet || git commit -m "Manual competitive research $(date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
