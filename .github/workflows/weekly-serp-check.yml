name: SERP Intelligence Check

on:
  schedule:
    - cron: '0 9 * * 3'  # Wednesday 9am UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/Denver

jobs:
  serp-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic python-dotenv requests

      - name: Run SERP intelligence check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/serp_intelligence.py

      - name: Rebuild SEO dashboard data
        run: python scripts/build_seo_data.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git add reports/ scripts/syndication_log.txt static/data/seo.json || true
          git diff --staged --quiet || git commit -m "Auto: SERP intelligence check $(date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
