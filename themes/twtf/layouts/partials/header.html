<header class="site-header">
  <div class="container">
    <div class="site-header__inner">
      <a href="{{ "/" | relURL }}" class="site-logo">
        <span class="site-logo__mark">
          <svg viewBox="0 0 64 64" width="22" height="22" role="img" aria-hidden="true">
            <path d="M15 43c9-10 21-12 34-8" fill="none" stroke="#f6c453" stroke-width="5" stroke-linecap="round"/>
            <path d="M20 24h18c5 0 9 4 9 9v1" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M46 34c0 5-3 8-7 8-3 0-5-2-5-5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <circle cx="18" cy="43" r="4" fill="currentColor"/>
            <circle cx="46" cy="37" r="3" fill="#f6c453"/>
          </svg>
        </span>
        <span class="site-logo__text">
          <span class="site-logo__title">Tow With The Flow</span>
          <span class="site-logo__sub">Roadside help guides</span>
        </span>
      </a>
      <nav class="site-nav" id="site-nav">
        <a href="{{ "/" | relURL }}">Home</a>
        <a href="{{ "/tools/" | relURL }}">Roadside Tools</a>
        <a href="{{ "/posts/" | relURL }}">All Guides</a>
        <a href="{{ "/search/" | relURL }}">Search</a>
        <a href="{{ "/about/" | relURL }}">About</a>
        <a href="{{ "/contact/" | relURL }}">Contact</a>
      </nav>
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
<script>
(function() {
  var btn = document.getElementById('hamburger-btn');
  var nav = document.getElementById('site-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function() {
    var open = nav.classList.toggle('is-open');
    btn.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  // Close on outside click
  document.addEventListener('click', function(e) {
    if (!btn.contains(e.target) && !nav.contains(e.target)) {
      nav.classList.remove('is-open');
      btn.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
