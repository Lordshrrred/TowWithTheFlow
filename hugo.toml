baseURL = "https://towwiththeflow.com/"
languageCode = "en-us"
title = "Tow With The Flow"
theme = "twtf"
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Real help when your car breaks down."
  tagline = "Real Answers When Your Car Breaks Down"
  subtagline = "No fluff. No runaround. Just what to do next."
  author = "Tow With The Flow"
  siteName = "Tow With The Flow"
  siteUrl = "https://towwiththeflow.com"
  googleAnalytics = "G-WLVMQG7X44"
  # LocalBusiness/AutomotiveBusiness schema on local posts (see serviceArea
  # frontmatter). Left blank deliberately — do not fill in a fake phone
  # number or address. Only set businessPhone/businessAddress once there's
  # a real one; the schema block simply omits whatever's blank.
  businessName = "Tow With The Flow"
  businessPhone = ""
  businessAddress = ""
  logo = "/apple-touch-icon.png"
  # Live syndication blog URLs, for Organization schema `sameAs`. Dev.to is
  # deliberately excluded — it rotates across 3 different account handles,
  # which doesn't fit sameAs's "this is the same entity" purpose. Replace/
  # extend with real social profile URLs (Twitter/X, Facebook, etc.) if any
  # exist later.
  sameAs = [
    "https://towwiththeflow.tumblr.com",
    "https://towingandflowingroadsidedenver.blogspot.com",
    "https://towwiththeflowyo.wordpress.com",
  ]

[permalinks]
  posts = "/:slug/"

[taxonomies]
  tag = "tags"
  cluster = "clusters"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
